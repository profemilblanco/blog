<!-- Table of Contents -->
<div class="sidebar-content">
    {% if page.title %}
    <h3>Tabla de Contenidos - {{ page.title }}</h3>
    {% else %}
    <h3>Tabla de Contenidos</h3>
    {% endif %}
    
    <!-- Generar TOC automáticamente usando jekyll-toc plugin -->
    {% if page.content %}
    <div id="toc">
        {% include toc.html html=content %}
    </div>
    {% endif %}
</div>
